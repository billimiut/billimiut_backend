name: CD
on:
  push:
    branches: [dev]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout...
        uses: actions/checkout@v3
      - name: Docker Login
        run: docker login -u ${{ secrets.DOCKER_ID }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker
        run: |
          docker build -f Dockerfile -t ${{ secrets.DOCKER_ID }}/billimiut-docker .
      - name: Push Docker
        run: |
          docker push ${{ secrets.DOCKER_ID }}/billimiut-docker:latest
      - name: SSH Login
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/billimiut_backend
            git pull origin dev
            sudo MONGO_PORT=${{ secrets.MONGO_PORT }} \
            MONGO_USER=${{ secrets.MONGO_USER }} \
            MONGO_PASS=${{ secrets.MONGO_PASS }} \
            MONGO_HOST=${{ secrets.MONGO_HOST }} \
            JWT_SECRET_KEY_ACCESS=${{ secrets.JWT_SECRET_KEY_ACCESS }} \
            JWT_SECRET_KEY_REFRESH=${{ secrets.JWT_SECRET_KEY_REFRESH }} \
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }} \
            BUCKET_URL=${{ secrets.BUCKET_URL }} \
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }} \
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }} \
            docker-compose -f docker-compose-dev.yml up -d

#            export MONGO_PORT=${{ secrets.MONGO_PORT }}
#            export MONGO_USER=${{ secrets.MONGO_USER }}
#            export MONGO_PASS=${{ secrets.MONGO_PASS }}
#            export MONGO_HOST=${{ secrets.MONGO_HOST }}
